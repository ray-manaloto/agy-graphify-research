[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agy_graphify"]

[project]
name = "agy-graphify-research"
version = "0.1.0"
description = "Async Python library & automation plugin for Antigravity, Graphify, & Multi-Agent Orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.13.4",
  "loguru>=0.7.3",
  "msgspec>=0.21.1",
  "orjson>=3.11.9",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "graphifyy>=0.9.35",
  "pyyaml>=6.0.1",
]

[project.scripts]
agy-graphify = "agy_graphify.cli:main"
agy-verify = "agy_graphify.verify:main"
agy-task = "agy_graphify.tasks:main"
agy-orchestrate = "agy_graphify.orchestration:main"
agy-graph-engine = "agy_graphify.graph_engine:main"
agy-dag = "agy_graphify.graph_engine:main"
agy-skillopt = "agy_graphify.skillopt:main"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    "scratch",
    ".venv",
    ".gemini",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D",       # Docstrings formatting
  "T201",    # Print statements allowed for CLI output
  "ANN",     # Any/Function argument type annotations in tests/CLI
  "FBT",     # Boolean positional args
  "Q000",    # Single quotes preference
  "PLC0415", # Top-level imports
  "E501",    # Line length
  "S101",    # Use of assert in pytest tests
  "PLR2004", # Magic value comparison in tests
  "ERA001",  # Header comments in datamodel-codegen outputs
  "N815",    # MixedCase schema fields
  "INP001",  # Implicit namespace packages
  "COM812",  # Trailing comma
  "ISC001",  # Implicit string concatenation
  "CPY001",  # Copyright header check
  "SLF001",  # Private member access
  "RUF059",  # Unpacked variable unused
  "ARG001",  # Unused function argument
  "RUF015",  # Prefer next(iter())
  "B018",    # Useless expression
  "C901",    # Cyclomatic complexity
  "SIM102",  # Nested if statements
  "ASYNC109", # Async function with timeout parameter
  "BLE001",  # Do not catch blind Exception
  "E402",    # Module level import not at top of file
  "S310",    # URL open audit
  "ASYNC240", # Pathlib in async function
  "F841",    # Unused local variable
  "DTZ005",  # datetime without tz
  "TRY003",  # Exception message outside class
  "EM101",   # Exception string literal
  "ISC004",  # Implicit string concatenation
  "UP042",   # Class inheriting str and Enum
  "RUF100",  # Unused noqa directive
  "PERF401", # List extend preference
  "E741",    # Ambiguous variable name
  "PTH105",  # Path.replace vs os.replace
  "PYI034",  # Return self in enter
  "PYI036",  # exit annotations
  "EM102",   # Exception f-string
  "PLR0915", # Too many statements
  "TRY300",  # Try else block recommendation
  "RET504",  # Unnecessary assignment before return
  "PLR0912", # Too many branches
  "TRY301",  # Abstract raise to inner function
  "B904",    # Raise from err
]

[tool.ty.environment]
python = "/Users/rmanaloto/.local/share/mise/installs/python/3.14.3/bin/python3"

[tool.ty.analysis]
respect-type-ignore-comments = true
allowed-unresolved-imports = [
  "pydantic",
  "loguru",
  "pytest",
  "orjson",
  "msgspec",
  "google_antigravity_sdk",
  "graphifyy",
  "yaml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:phoenix"
