name: ci

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_EXPERIMENTAL: true

jobs:
  pr-policy-check:
    name: Enforce PR-Only Workflow
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR Execution
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.author.name != 'github-actions[bot]'
        run: |
          echo "Direct push to main detected. All work must be submitted via Pull Request."

  ci:
    name: Build & Verify Task Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - run: mise run check
