[settings]
experimental = true
auto_install = true

[env]
PYTHONPATH = "src"
AGY_PROJECT_MODE = "isolated"
PHOENIX_WORKING_DIR = ".gemini/phoenix"

[tools]
python = "3.14.7"
uv = "0.12.2"
ruff = "0.16.1"
ty = "0.0.68"
hk = "1.54.0"
fnox = "1.32.0"
pkl = "0.32.1"
taplo = "0.10.0"
gh = "2.97.0"
cmake = "4.4.2"
ninja = "1.13.2"
"pipx:graphifyy" = { version = "0.9.35", extras = ["all"] }
"pipx:datamodel-code-generator" = "0.72.1"
"pipx:mkdocs" = "1.6.1"
"conda:ffmpeg" = { version = "8.1.2", os = ["macos"] }

[tasks.generate-models]
description = "Generate Pydantic v2 models from schemas using datamodel-code-generator"
run = [
  "uv run datamodel-codegen --input schemas/ --output src/agy_graphify/models/ --output-model-type pydantic_v2.BaseModel",
  "uv run ruff format src/agy_graphify/models/",
]

[tasks.lint]
description = "Lint Python codebase with ruff"
run = "uv run ruff check src tests \"$@\""

[tasks.format]
description = "Format Python code with ruff"
run = "uv run ruff format \"$@\""

[tasks.typecheck]
description = "Run type analysis with ty"
run = "uv run ty check src tests \"$@\""

[tasks.test]
description = "Run async unit tests with pytest"
run = "uv run pytest \"$@\""

[tasks.okf]
description = "Validate documentation files against Open Knowledge Format (OKF) spec"
run = "uv run python3 -m agy_graphify.okf \"$@\""

[tasks.telemetry]
description = "Collect conversation telemetry events into project .gemini/telemetry/"
run = "uv run python3 -m agy_graphify.telemetry \"$@\""

[tasks.context]
description = "Monitor context token usage (<50% threshold) and evaluate subagent delegation"
run = "uv run python3 -m agy_graphify.context_manager \"$@\""

[tasks.verify]
description = "Verify project environment state, zero shell scripts, and toolchain pinning"
run = "uv run agy-verify \"$@\""

[tasks.post-task]
description = "Automated post-task reflection: run telemetry collection, context analysis, and OKF check"
depends = ["telemetry", "context", "okf"]

[tasks.graphify]
description = "Run graphify AST knowledge graph extraction"
run = "uv run graphify \"$@\""

[tasks.graphify-setup]
description = "Setup Graphify with native Python SDK"
run = "uv run agy-task graphify-setup \"$@\""

[tasks.docs]
description = "Build autogenerated documentation site with MkDocs"
run = "uv run mkdocs build \"$@\""

[tasks.orchestrate]
description = "Run multi-agent workflow orchestration"
run = "uv run agy-orchestrate \"$@\""

[tasks.task]
description = "Run flexible Python task dispatcher"
run = "uv run agy-task \"$@\""

[tasks.graph-engine]
description = "Run Sol-Orchestrator state graph engine"
run = "uv run agy-graph-engine \"$@\""

[tasks.dag]
description = "Execute or plan multi-agent state graph DAG workflow"
run = "uv run agy-graph-engine \"$@\""

[tasks.skillopt]
description = "Run Microsoft SkillOpt prompt optimization and trajectory evaluation"
run = "uv run agy-skillopt \"$@\""

[tasks.harness-validate]
description = "Validate multi-agent orchestration graph harness, telemetry, and modular task dispatch"
run = "uv run agy-task harness-validate \"$@\""

[tasks.check]
description = "Run model generation, linting, typecheck, pytest, OKF spec validation, telemetry, environment verification, and harness validation"
depends = [
  "generate-models",
  "lint",
  "typecheck",
  "test",
  "okf",
  "telemetry",
  "verify",
  "harness-validate",
]

[tasks.ingest-sources]
description = "Ingest, deduplicate, and clone extended repository sources"
run = "uv run python scratch/ingest_extended_sources.py \"$@\""

[tasks.extract-colibri]
description = "Run multi-model Colibri v1.5.0 extraction and evaluation"
run = "uv run python scratch/benchmark_colibri_models.py \"$@\""

[tasks.universal-log]
description = "Tail universal log file .gemini/telemetry/universal.log"
run = "tail -f .gemini/telemetry/universal.log"

[tasks.update-sources]
description = "Update all repositories and check Git SHA differential tracking state"
run = "uv run agy-task update-all-sources \"$@\""

[tasks.monitor-logs]
description = "Run real-time fail-fast log assertion scanner"
run = "uv run agy-task monitor-logs \"$@\""

[tasks.clean-logs]
description = "Clean old process-isolated log files"
run = "uv run agy-task clean-logs \"$@\""

[tasks.pr-merge]
description = "Squash-merge Pull Request via gh CLI and delete feature branch"
run = "uv run agy-task pr-merge \"$@\""

[tasks.sync-main]
description = "Checkout local main and pull latest changes from origin/main"
run = "uv run agy-task sync-main \"$@\""

[tasks.create-pr]
description = "Create a new feature branch, commit changes, create PR via gh CLI, and return to main"
run = "uv run agy-task create-pr \"$@\""

[tasks.colibri-graphify]
description = "Execute local zero-token Colibri Graphify AST and semantic graph extraction"
run = "uv run agy-task colibri-graphify \"$@\""

